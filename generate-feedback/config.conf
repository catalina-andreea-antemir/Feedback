[GENERATOR]
# NOTE: these two now mean ENROLLED students, not the number of responses. The response
# count is derived from enrolment via the response rate below -- that is what keeps the
# completion percentage (responses / enrolled) at or under 100%.
#
# They are absolute BOUNDS, not the range itself: actual enrolment follows the course's
# level and year (a first-year mandatory course has ~220 students, a master elective ~26).
# Keep them wide. Narrowing them to, say, 20..100 flattens that spread, and the spread is
# what makes the 7% response-RATE threshold behave differently from the response-COUNT
# thresholds.
MIN_STUDENTS = 8
MAX_STUDENTS = 400

# Per-course response rate. The pipeline's 7% selection threshold sits inside this range
# on purpose: some courses fall under it and get filtered out, most survive.
MIN_RESPONSE_RATE = 0.025
MAX_RESPONSE_RATE = 0.325

# Same seed => byte-identical output.
SEED = 1337

# Only generate for courses under this Moodle category. 7 = ACS. Use 0 for the whole
# platform -- that is ~9700 feedback forms and several GB of JSON.
CATEGORY_ID = 7

# feedback_contents/ and users/ are written side by side under OUTPUT_DIR. Their names are
# NOT configurable: the web interface hardcodes both and ignores the export unless the two
# sit next to each other.
OUTPUT_DIR = out
